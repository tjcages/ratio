name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      # Pull requests build ad-hoc; pushes and manual runs sign and notarize once the secrets exist.
      SIGN: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, self-test, and package
        env:
          NOTARY_APPLE_ID: ${{ env.SIGN == 'true' && secrets.APPLE_ID || '' }}
          NOTARY_TEAM_ID: ${{ env.SIGN == 'true' && secrets.APPLE_TEAM_ID || '' }}
          NOTARY_PASSWORD: ${{ env.SIGN == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
        run: native/package.sh

      - name: Run UI checks and render previews
        run: |
          mkdir -p native/dist/previews
          native/Ratio.app/Contents/MacOS/Ratio --preview "$PWD/native/dist/previews"

      - uses: actions/upload-artifact@v4
        with:
          name: Ratio
          path: |
            native/dist/Ratio.dmg
            native/dist/Ratio.zip
            native/dist/previews/*.png

      # Each new CFBundleShortVersionString on main becomes a release; the README links to the latest one.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/Ratio.app/Contents/Info.plist)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version in Info.plist to publish a new one."
          else
            gh release create "v$version" native/dist/Ratio.dmg native/dist/Ratio.zip \
              --title "Ratio $version" --target "$GITHUB_SHA" --latest \
              --notes-file RELEASE-NOTES.md
          fi
