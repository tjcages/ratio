name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build, self-test, and package
        run: native/package.sh

      - name: Run UI checks and render previews
        run: |
          mkdir -p native/dist/previews
          native/Ratio.app/Contents/MacOS/Ratio --preview "$PWD/native/dist/previews"

      - name: Commit screenshots to this branch (temporary)
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "$GITHUB_HEAD_REF"
          git checkout -q -B shots "origin/$GITHUB_HEAD_REF"
          mkdir -p docs/previews && cp native/dist/previews/*.png docs/previews/
          git add docs/previews
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Add rendered previews"
          git push -q origin "HEAD:$GITHUB_HEAD_REF"

      - uses: actions/upload-artifact@v4
        with:
          name: Ratio
          path: |
            native/dist/Ratio.dmg
            native/dist/Ratio.zip
            native/dist/previews/*.png

      # Each new CFBundleShortVersionString on main becomes a release; the README links to the latest one.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/Ratio.app/Contents/Info.plist)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version in Info.plist to publish a new one."
          else
            gh release create "v$version" native/dist/Ratio.dmg native/dist/Ratio.zip \
              --title "Ratio $version" --target "$GITHUB_SHA" --latest \
              --notes-file RELEASE-NOTES.md
          fi
